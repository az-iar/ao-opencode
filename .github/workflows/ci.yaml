name: ci

# The repo had no workflow, so every pull request in ao-opencode was merged on
# whoever ran the suite locally (az-iar/ao-opencode#25). This is the same shape
# as ao-pi's .github/workflows/ci.yaml and ao-runner's: the checks a reviewer
# would run by hand, on push and on every pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One run per branch: a force-push or a second push cancels the older run
  # rather than paying for it twice.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub-hosted, because this repo has no self-hosted runner registered: the
    # ai-om runners in this account belong to agent-office. The tests need
    # nothing a hosted image lacks: they are Node, and the only network they
    # touch is a loopback fake office (test/fake-office.mts).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every test file gets this from test/suite.mts. At job level it is the
    # backstop for the file that forgets that import: a hosted image ships real
    # browsers, and a stray one polls the approval URL and shows up in another
    # test's Office call log, which is agent-office#531's concern.
    env:
      AGENT_OFFICE_OPEN_BROWSER: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json's test script passes --experimental-strip-types, which
          # needs 22.18 or newer, so 22.x is the oldest line that satisfies it.
          # A major bump belongs in a deliberate matrix ([22.x, 24.x]), not in a
          # floating range that moves the CI off 22 without anyone deciding.
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: temp dirs
        # The guard for the /tmp rule: it runs the suite once more as a child and
        # counts top-level /tmp entries before and after. It cannot be one of the
        # files in the run above (it is test/tmp-guard.mts, outside the
        # *.test.mts glob), or two copies of the suite would bind the same fixed
        # callback ports at once.
        run: npm run test:tmp
